name: Build second-brain site
description: Generate a static second-brain site from Brain Markdown
author: Tobias Jakobsson

inputs:
  vault:
    description: Brain directory beneath the caller workspace; leave empty when using workspace
    required: false
    default: ""
  workspace:
    description: Workspace manifest beneath the caller workspace; leave empty when using vault
    required: false
    default: ""
  output:
    description: Generated site directory, relative to the caller workspace or absolute
    required: false
    default: dist
  site:
    description: Canonical HTTP(S) origin
    required: false
    default: ""
  base-path:
    description: Deployment base path
    required: false
    default: /
  exclusions:
    description: Newline-delimited Brain directory exclusion patterns
    required: false
    default: ""
  strict-links:
    description: Fail when the Brain directory contains unresolved note links
    required: false
    default: "false"

outputs:
  output-path:
    description: Absolute normalized path to the generated site
    value: ${{ steps.generate.outputs.output-path }}

runs:
  using: composite
  steps:
    - id: generate
      name: Generate site
      shell: bash
      env:
        BRAIN_IMAGE: ghcr.io/tjakobsson/brain@sha256:067cd888257be52218532184143897e7f05c7f66739fc3f78757855f2959d2c2
        INPUT_VAULT: ${{ inputs.vault }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SITE: ${{ inputs.site }}
        INPUT_BASE_PATH: ${{ inputs.base-path }}
        INPUT_EXCLUSIONS: ${{ inputs.exclusions }}
        INPUT_STRICT_LINKS: ${{ inputs.strict-links }}
      run: "$GITHUB_ACTION_PATH/scripts/run-generator-action.sh"

branding:
  icon: book-open
  color: green
