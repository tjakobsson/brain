name: Build second brain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: site
        uses: tjakobsson/brain@v1
        with:
          vault: vault
          output: dist
          site: https://example.com
          base-path: /
          strict-links: true
      - run: test -d "${{ steps.site.outputs.output-path }}"
