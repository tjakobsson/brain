name: Publish second brain immutably

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    uses: tjakobsson/brain-manual/.github/workflows/publish-pages.yml@c7272d2f803da6c95fc011cba312f6ab77430253
    with:
      vault: vault
      exclusions: |-
        Private/**
        Drafts/**
      strict-links: true
