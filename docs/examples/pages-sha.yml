name: Publish second brain immutably

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    uses: tjakobsson/brain/.github/workflows/publish-pages.yml@32967ee69c0f9f2b1d1d68361e7214a0ca3b7c82 # v1
    with:
      vault: vault
      exclusions: |-
        Private/**
        Drafts/**
      strict-links: true
