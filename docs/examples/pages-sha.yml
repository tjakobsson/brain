name: Publish second brain immutably

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    uses: tjakobsson/brain/.github/workflows/publish-pages.yml@c4b1c5d33b034476afda3b72d20bb6506a34ffdf # v1
    with:
      vault: vault
      exclusions: |-
        Private/**
        Drafts/**
      strict-links: true
