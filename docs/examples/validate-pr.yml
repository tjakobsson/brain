name: Validate second brain

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brain source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: site
        name: Build site
        uses: tjakobsson/brain@v1
        with:
          vault: .
          output: ${{ runner.temp }}/brain-site
          strict-links: true

      - name: Upload generated site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: brain-site-pr-${{ github.event.pull_request.number }}
          path: ${{ steps.site.outputs.output-path }}
          if-no-files-found: error
          retention-days: 7
