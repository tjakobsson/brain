name: Build second brain immutably

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: site
        uses: tjakobsson/brain@32967ee69c0f9f2b1d1d68361e7214a0ca3b7c82 # v1
        with:
          vault: vault
          output: dist
          strict-links: true
      - run: test -d "${{ steps.site.outputs.output-path }}"
