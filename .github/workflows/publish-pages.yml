name: Publish second brain to Pages

on:
  workflow_call:
    inputs:
      vault:
        description: Brain directory in the caller repository; leave empty when using workspace
        required: false
        default: ""
        type: string
      workspace:
        description: Workspace manifest whose brain directories are in the caller repository
        required: false
        default: ""
        type: string
      exclusions:
        description: Newline-delimited Brain exclusion patterns
        required: false
        default: ""
        type: string
      strict-links:
        description: Fail when a Brain link cannot be resolved
        required: false
        default: false
        type: boolean
    outputs:
      page-url:
        description: URL of the deployed Pages site
        value: ${{ jobs.deploy.outputs.page-url }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: pages
        name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Generate site
        env:
          GENERATOR_IMAGE: ghcr.io/tjakobsson/brain@sha256:4fa9ececec57425ca76dc6340a0d1cbdc53e3ff118e2beedb745894fba812fa8
          INPUT_VAULT: ${{ inputs.vault }}
          INPUT_WORKSPACE: ${{ inputs.workspace }}
          INPUT_EXCLUSIONS: ${{ inputs.exclusions }}
          INPUT_STRICT_LINKS: ${{ inputs.strict-links }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          checkout="$(realpath -e -- "$GITHUB_WORKSPACE")"
          vault_input="$INPUT_VAULT"
          workspace_input="$INPUT_WORKSPACE"
          if [[ -n "$vault_input" && -n "$workspace_input" ]]; then
            echo "Options --vault and --workspace are mutually exclusive; choose one input mode." >&2
            exit 1
          fi
          if [[ -z "$vault_input" && -z "$workspace_input" ]]; then
            vault_input="vault"
          fi

          require_in_checkout() {
            case "$1" in
              "$checkout") printf '.' ;;
              "$checkout"/*) printf '%s' "${1#"$checkout"/}" ;;
              *)
                echo "$2 must be inside the caller repository checkout: $1" >&2
                exit 1
                ;;
            esac
          }

          build_root="$RUNNER_TEMP/brain-pages"
          mkdir -p "$build_root/output" "$build_root/work" "$build_root/tmp"

          args=(
            build
            --output /output/site
            --site "$PAGES_ORIGIN"
            --base "${PAGES_BASE_PATH:-/}"
          )
          mounts=()
          if [[ -n "$workspace_input" ]]; then
            workspace_path="$(realpath -e -- "$GITHUB_WORKSPACE/$workspace_input")"
            require_in_checkout "$workspace_path" "Workspace manifest" >/dev/null
            node --input-type=module - "$workspace_path" "$checkout" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const [manifestPath, checkout] = process.argv.slice(2);
          let manifest;
          try {
            manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          } catch {
            process.exit(0); // The generator reports malformed manifests with its full diagnostic.
          }
          if (!Array.isArray(manifest.brains)) process.exit(0);

          const inside = (candidate) => {
            const relative = path.relative(checkout, candidate);
            return relative === "" || (!relative.startsWith(`..${path.sep}`) && relative !== ".." && !path.isAbsolute(relative));
          };
          for (const brain of manifest.brains) {
            if (typeof brain?.path !== "string") continue;
            const configured = path.resolve(path.dirname(manifestPath), brain.path);
            let resolved = configured;
            try {
              resolved = fs.realpathSync(configured);
            } catch {
              // The image reports missing sources by brain ID after the boundary check.
            }
            if (!inside(configured) || !inside(resolved)) {
              const id = typeof brain.id === "string" ? brain.id : "<unknown>";
              console.error(`Brain ${JSON.stringify(id)} resolves outside the caller repository checkout: ${resolved}`);
              console.error("The reusable Pages workflow supports only sources in the caller checkout. Prepare multiple checkouts in a caller-authored job and use the Brain build Action instead.");
              process.exit(1);
            }
          }
          NODE
            args+=(--workspace "$workspace_path")
            mounts+=(--mount "type=bind,src=$checkout,dst=$checkout,readonly")
          else
            vault_path="$(realpath -e -- "$GITHUB_WORKSPACE/$vault_input")"
            require_in_checkout "$vault_path" "Brain directory" >/dev/null
            args+=(--vault /vault)
            mounts+=(--mount "type=bind,src=$vault_path,dst=/vault,readonly")
          fi
          while IFS= read -r pattern || [[ -n "$pattern" ]]; do
            [[ -z "$pattern" ]] && continue
            args+=(--exclude "$pattern")
          done <<< "$INPUT_EXCLUSIONS"
          if [[ "$INPUT_STRICT_LINKS" == "true" ]]; then
            args+=(--strict-links)
          fi

          docker run --rm \
            --read-only \
            --network none \
            --user "$(id -u):$(id -g)" \
            "${mounts[@]}" \
            --mount "type=bind,src=$build_root/output,dst=/output" \
            --mount "type=bind,src=$build_root/work,dst=/work" \
            --mount "type=bind,src=$build_root/tmp,dst=/tmp" \
            "$GENERATOR_IMAGE" "${args[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/brain-pages/output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy Pages artifact
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
