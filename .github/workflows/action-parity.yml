name: Candidate Action parity

on:
  pull_request:
    paths:
      - "release/candidate.json"
  push:
    branches:
      - main
    paths:
      - "release/candidate.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GENERATOR_IMAGE: ghcr.io/tjakobsson/brain@sha256:8e414bc2baaaa2e56b63120bf8d54241719fa6c28485ccd0a6972fba9217ac6c

jobs:
  image-platform:
    name: Candidate image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify platform output parity
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/generator.mjs build \
            --vault examples/demo-vault \
            --output .generated/platform-source \
            --site https://example.com \
            --base /notes \
            --exclude '.obsidian/**' \
            --strict-links
          mkdir -p .generated/platform-image .generated/platform-work .generated/platform-tmp
          docker run --rm \
            --platform "$PLATFORM" \
            --read-only \
            --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/examples/demo-vault,dst=/vault,readonly" \
            --mount "type=bind,src=$PWD/.generated/platform-image,dst=/output" \
            --mount "type=bind,src=$PWD/.generated/platform-work,dst=/work" \
            --mount "type=bind,src=$PWD/.generated/platform-tmp,dst=/tmp" \
            "$GENERATOR_IMAGE" build \
            --vault /vault \
            --output /output/site \
            --site https://example.com \
            --base /notes \
            --exclude '.obsidian/**' \
            --strict-links
          node scripts/compare-output-trees.mjs \
            .generated/platform-source \
            .generated/platform-image/site

  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned image digests agree
        run: >-
          node scripts/check-image-digests.mjs
          action.yml
          .github/workflows/action-parity.yml
          .github/workflows/publish-pages.yml

      - name: Build through source command
        run: >-
          node scripts/generator.mjs build
          --workspace examples/demo-workspace/workspace.json
          --output .generated/parity-command
          --site https://example.com
          --base /notes

      - name: Build through candidate image
        run: |
          mkdir -p .generated/parity-image .generated/parity-image-work .generated/parity-image-tmp
          docker run --rm \
            --read-only \
            --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/examples/demo-workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$PWD/.generated/parity-image,dst=/output" \
            --mount "type=bind,src=$PWD/.generated/parity-image-work,dst=/work" \
            --mount "type=bind,src=$PWD/.generated/parity-image-tmp,dst=/tmp" \
            "$GENERATOR_IMAGE" build \
            --workspace /workspace/workspace.json \
            --output /output/site \
            --site https://example.com \
            --base /notes

      - id: action-build
        name: Build through composite Action
        uses: ./
        with:
          workspace: examples/demo-workspace/workspace.json
          output: .generated/parity-action
          site: https://example.com
          base-path: /notes

      - name: Verify output parity
        env:
          ACTION_OUTPUT: ${{ steps.action-build.outputs.output-path }}
        run: |
          expected="$(realpath -m .generated/parity-action)"
          [[ "$ACTION_OUTPUT" == "$expected" ]]
          node scripts/compare-output-trees.mjs \
            .generated/parity-command \
            .generated/parity-image/site \
            .generated/parity-action

      - id: exclusions
        name: Exercise custom exclusions
        uses: ./
        with:
          vault: examples/demo-vault
          output: .generated/excluded-action
          exclusions: Portable notes.md

      - name: Verify custom exclusions
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const graph = JSON.parse(fs.readFileSync(".generated/excluded-action/graph-data.json", "utf8"));
          if (graph.nodes.some((node) => node.title === "Portable notes")) process.exit(1);
          if (!graph.nodes.some((node) => node.title === "Welcome")) process.exit(1);
          if (fs.existsSync(".generated/excluded-action/notes/portable-notes/index.html")) process.exit(1);
          NODE

      - id: conflicting-inputs
        name: Reject conflicting Action inputs
        continue-on-error: true
        uses: ./
        with:
          vault: examples/demo-vault
          workspace: examples/demo-workspace/workspace.json
          output: .generated/conflicting-action

      - name: Require conflicting-input failure
        if: steps.conflicting-inputs.outcome != 'failure'
        run: exit 1

      - name: Require unavailable brain mount diagnostics
        env:
          BRAIN_IMAGE: ${{ env.GENERATOR_IMAGE }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          RUNNER_OS: Linux
          INPUT_VAULT: ""
          INPUT_WORKSPACE: .generated/unavailable-workspace.json
          INPUT_OUTPUT: .generated/unavailable-action
          INPUT_SITE: ""
          INPUT_BASE_PATH: /
          INPUT_EXCLUSIONS: ""
          INPUT_STRICT_LINKS: "false"
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          fs.writeFileSync(".generated/unavailable-workspace.json", JSON.stringify({
            version: 1,
            title: "Unavailable mount",
            brains: [{ id: "missing-brain", title: "Missing brain", path: "./not-mounted" }],
          }));
          NODE
          export GITHUB_OUTPUT="$RUNNER_TEMP/brain-action-unavailable-output"
          if logs="$(scripts/run-generator-action.sh 2>&1)"; then
            echo "Unavailable workspace unexpectedly succeeded." >&2
            exit 1
          fi
          [[ "$logs" == *'Brain "missing-brain"'* ]]
          [[ "$logs" == *'not-mounted'* ]]

      - id: strict-failure
        name: Exercise strict-link failure diagnostics
        continue-on-error: true
        uses: ./
        with:
          vault: tests/fixtures/strict-vault
          output: .generated/strict-failure
          strict-links: true

      - name: Require strict-link failure
        if: steps.strict-failure.outcome != 'failure'
        run: exit 1
