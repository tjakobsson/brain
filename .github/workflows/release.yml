name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tjakobsson/brain'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify recorded candidate
        run: node scripts/release-check.mjs --verify-remote

      - id: candidate
        name: Read release metadata
        run: |
          version="$(node -p "require('./release/candidate.json').version")"
          digest="$(node -p "require('./release/candidate.json').imageDigest")"
          source_commit="$(node -p "require('./release/candidate.json').sourceCommit")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match candidate v$version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "digest=$digest"
            echo "source-commit=$source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Promote tested image
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          major="${VERSION%%.*}"
          remainder="${VERSION#*.}"
          minor="${remainder%%.*}"
          tags=("v$VERSION" "v$major.$minor" "v$major" latest)

          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$image:$tag" "$image@$DIGEST"
          done

          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')"
            if [[ "$actual" != "$DIGEST" ]]; then
              echo "$image:$tag resolves to $actual, expected $DIGEST" >&2
              exit 1
            fi
          done

      - name: Move maintained major tag
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          git tag --force "v$major" "$GITHUB_SHA"
          git push origin "refs/tags/v$major" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source-commit }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node --input-type=module - "$notes" <<'NODE'
          import fs from "node:fs";
          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}@${process.env.DIGEST}`;
          const major = process.env.VERSION.split(".")[0];
          fs.writeFileSync(process.argv[2], `# Brain v${process.env.VERSION}\n\nSee [CHANGELOG.md](https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${process.env.GITHUB_SHA}/CHANGELOG.md) for release highlights.\n\n- Compatibility: v${major}\n- Release commit: \`${process.env.GITHUB_SHA}\`\n- Image source commit: \`${process.env.SOURCE_COMMIT}\`\n- OCI image: \`${image}\`\n- Platforms: \`linux/amd64\`, \`linux/arm64\`\n- Supply chain: SPDX SBOM and SLSA provenance are attached to the OCI index. GitHub build provenance is available through the repository attestations.\n`);
          NODE
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Brain $GITHUB_REF_NAME" \
            --notes-file "$notes"
